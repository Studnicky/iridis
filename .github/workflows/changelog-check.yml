name: changelog-check

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  check:
    name: Changeset required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Release and hotfix PRs consume pending changesets via `changeset version`,
    # so no new changeset file is expected on those branches. The publish
    # workflow (on the v* tag) enforces that no changesets remain unconsumed.
    if: ${{ github.actor != 'dependabot[bot]' && !startsWith(github.head_ref,
      'release/') && !startsWith(github.head_ref, 'hotfix/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify a changeset was added
        run: bash scripts/policy-suite.sh changeset-required
